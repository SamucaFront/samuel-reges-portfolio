    <meta name="description" content="Samuel Reges — Software Developer. Portfólio de desenvolvimento Full Stack: web, mobile e back-end." />
    <meta name="theme-color" content="#E9E9E9" />
    <title>Samuel Reges — Portfolio</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('sr-theme');
          var t = s === 'light' || s === 'dark' ? s : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
